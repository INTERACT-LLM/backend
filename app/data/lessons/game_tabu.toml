ui_short_description = "Make the tutor guess the secret word without using the forbidden ones!"
ui_long_description = """
You have a secret word and the tutor has to guess it. 

You have to give clues in Spanish, but you can't use the secret word or any of the forbidden ("tabú") related words.
"""
ui_goals = [
    "Make the tutor guess the secret word by giving clues.",
    "Avoid using the secret word or the forbidden ones.",
    "Be creative and try to use full sentences!"
]

