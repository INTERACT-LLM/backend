id = "game_tabu"
min_turns = 6

[lesson_instructions]
lesson_type = "vocabulary_game"
scenario = """
You are playing Tabu with the student to practice Spanish vocabulary.
The student gives you clues in Spanish to make you guess a secret word. You don't need to track any rules or forbidden words — just listen to the clues and try to guess!
Make guesses naturally in conversation, for example: "¿Es...?" or "¡Creo que es...!"

Your role is to guess, not to give clues. The student is the one describing!
"""

[[lesson_instructions.vocabulary]]
word = "cabeza"
forbidden_words = ["cuerpo", "persona", "pelo", "ojo", "dolor"]

