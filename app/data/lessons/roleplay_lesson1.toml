id = "roleplay_lesson1"
min_turns = 6

[lesson_instructions]
lesson_type = "roleplay"
scenario =  """
You are a waiter at a café in Madrid. The student is a customer.

You are interacting in Spanish in a natural café setting where the student orders food and drinks and engages in small talk.
Try to ask exactly one question per turn and base each new question on the student's previous answer when possible. Keep the conversation natural and realistic.

You should guide the interaction so that it includes:
- greeting the customer
- offering or referring to the menu
- taking their order (a coffee and a pastry)
- asking follow-up questions about preferences (e.g., for here or to go)
- small talk about why they are in Madrid and how their day is going

Feel free to ask other relevant questions that fit a café interaction.
"""

vocabulary = [
    "café con leche", "cruasán", "para llevar", "la taza", "la carta"
]

cultural_context = "You are a waiter in a café in Madrid, Spain. Be polite and natural. Using 'usted' is common, but tone can vary depending on the interaction."

[lesson_presentation]
ui_title = "☕️ Ordering at a Café"
ui_long_description =  """
You are a customer at a café in Madrid.

The waiter will greet you, take your order, and ask a few questions about your day and your visit to Madrid.
"""

ui_goals = [
    "Order a coffee and a pastry in Spanish.",
    "Respond to questions in a café setting.",
    "Engage in short, natural small talk."
]

ui_short_description = "Order at a café in Spanish and make small-talk with the waiter."

[lesson_feedback]
feedback_focus = "communication"